[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-jobs"
version = "0.2.1"
description = "Durable owner-fenced jobs and bounded worker helpers for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk>=0.4.0,<1"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-jobs"
Repository = "https://github.com/toolframe/toolframe-jobs"
Documentation = "https://github.com/toolframe/toolframe-jobs#readme"
Issues = "https://github.com/toolframe/toolframe-jobs/issues"

[project.optional-dependencies]
ui = ["streamlit==1.61.0"]

[project.entry-points."toolframe.plugins"]
jobs = "toolframe_jobs.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "toolframe-sql-sqlite>=0.4.0,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
toolframe-sql-sqlite = { path = "../toolframe-sql-sqlite", editable = true }
