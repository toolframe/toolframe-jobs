[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-jobs-counter"
version = "0.1.0"
description = "Installable Toolframe business example for resumable durable jobs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "toolframe-jobs==0.1.0",
    "toolframe-sdk==0.3.0",
]

[project.entry-points."toolframe.plugins"]
jobs-counter = "toolframe_demo_durable_counter.plugin:plugin"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "toolframe-jobs==0.1.0",
    "toolframe-storage-sqlite==0.3.0",
]

[tool.uv.sources]
toolframe-jobs = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_demo_durable_counter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
