[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-jobs"
version = "0.1.0"
description = "Durable owner-fenced jobs and bounded worker helpers for Toolframe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.3.0"]

[project.optional-dependencies]
ui = ["streamlit==1.61.0"]

[project.entry-points."toolframe.plugins"]
jobs = "toolframe_jobs.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "toolframe-storage-sqlite==0.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
